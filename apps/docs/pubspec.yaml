name: dvm_docs
description: >
  The dvm documentation site — installing dvm, pinning a Dart SDK per
  project with .dvmrc, and a page for every command. Static Jaspr site
  published to GitHub Pages; not part of the shipped CLI.
publish_to: none

resolution: workspace

environment:
  # Higher than the workspace root's ^3.6.0, which is the floor the CLI in
  # packages/dvm supports. This app is never shipped to a user's machine, only
  # built in CI, and 3.8 is where null-aware elements (`[?maybeNull]`) landed —
  # jaspr's own components use them and so does this app's layout. On 3.6 the
  # build fails inside jaspr_builder with a ParallelWaitError that never names
  # the language version.
  sdk: ^3.8.0

dependencies:
  # jaspr and jaspr_builder are pinned to the SAME exact version, and
  # test/pubspec_versions_test.dart fails if they drift apart. jaspr_builder
  # pins its own jaspr dependency to an exact version per release, so a caret
  # range on either one resolves to a pair that does not build — and the
  # failure surfaces only when dart2js whole-program compiles the real client
  # entrypoint, which `dart analyze` never does.
  jaspr: 0.23.2
  jaspr_content: ^0.5.3
  # 0.8.3 calls `AppBinding.basePath`, which first exists in jaspr 0.23.2.
  # Its own `jaspr: ^0.23.0` constraint does not express that.
  jaspr_router: ^0.8.3

dev_dependencies:
  build_runner: ^2.10.0
  build_web_compilers: ^4.8.0
  jaspr_builder: 0.23.2
  # For test/build_smoke_test.dart and test/base_path_test.dart, which run
  # `dart run jaspr_cli:jaspr build` — a project dependency rather than a
  # global activation, so the tests are self-contained. Pinned alongside
  # jaspr/jaspr_builder for the same reason those two are pinned together.
  jaspr_cli: 0.23.2
  lints: ^6.0.0
  test: ^1.26.0

jaspr:
  mode: static
