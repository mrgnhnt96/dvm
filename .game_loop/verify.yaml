# GATE ON THE COMMAND CI RUNS, NOT A LOCAL EQUIVALENT OF IT.
#
# The natural rule to write here is the ergonomic local one, and it inherits none of this gate's
# promise. A consumer ran `flutter analyze lib` for a year against a CI that ran
# `dart analyze --fatal-infos` over the whole tree: two differences — scope, and whether infos are
# fatal — neither visible by reading the rule, and the gate reported the same green either way.
#
# That is the "check that cannot fail" one level up. Not a command that cannot fail, but one that
# fails at DIFFERENT THINGS than the command that decides whether your change is actually good.
#
# So: paste CI's command. If you genuinely cannot run it locally — it needs a runner, a service, a
# platform you do not have — write the difference in a comment ABOVE the rule, in the two terms that
# actually diverge: what it covers, and what it treats as fatal. A named difference is a decision;
# an unnamed one is a surprise with a green tick in front of it.

# WHAT MUST BE RUN WHEN A THING CHANGES.
#
# The rule this encodes: if a change has an OUTPUT that is not the thing you edited — a code
# generator, template, migration, schema, serializer, IaC, build script — no verification counts
# until the output's real consumer has consumed it. A generator's own test comparing emitted text to
# emitted text, an analyzer configured to exclude the output dir, a downstream that exercises none of
# the changed code: three green signals, all vacuous, none lying.
#
# FORMAT:  <glob>: [<command>, ...]   — commands run from the repo root.
# A `<glob>/**` entry matches anything under that directory.
# The commands must FAIL when the change is broken. A command that cannot fail is not a check.
#
# This file ships EMPTY: game_loop does not know your project. `verify` and the commit gate are no-ops
# until you add rules. Examples (delete and replace with your own):
#
# "src/**":
#   - "npm test"
#   - "npm run lint"
#
# "schema/*.sql":
#   - "./scripts/apply-migrations.sh --dry-run"
#
# COVERAGE — a map of listed paths defaults to OWES-NOTHING, so a path nobody listed passes
# `verify --check` in perfect silence. That is how a whole new package gets built, hand-tested and
# committed with the gate reporting clean: green meant "nothing LISTED here is stale", never
# "nothing is unverified". So coverage is computed the other way round — every changed path counts
# as UNCHECKED until a rule claims it or you exclude it here. Ask at any time:
#
#     ./.game_loop/bin/verify --coverage
#
# `game_loop status` re-prints the same set every session, and the write guard names it at
# `git commit`. While this file is empty that report says so plainly: nothing is checked.
#
# The one reserved key. Its entries are GLOBS, not commands — paths that genuinely need no check:
#
# "unchecked-ok":
#   - "docs/**"
#   - "*.md"
#
# Excluding is a stated decision that stays visible in this file and is counted in every report.
# Leaving something UNCHECKED is fine too — it just says so out loud on every commit that touches
# it. Being unchecked NEVER blocks: this file ships empty, so "unlisted ⇒ refused" would refuse
# your first commit with the fix sitting behind the gate. Want the strict version? Opt in with a
# catch-all rule:  "*": ["<your test command>"].

# ---------------------------------------------------------------------------
# dvm's rules.
#
# These mirror what .github/workflows/test.yml runs, in the same scope and with
# the same fatality. NOTE that workflow is being written by the `release` leaf as
# this lands, so today this file is the SPECIFICATION of what CI will run. When
# the workflow exists, the two must be compared: if they drift, this gate goes
# green at different things than CI does, which is exactly the failure the header
# of this file warns about.
#
# `dart pub get` is part of the analyze rule because members of a pub workspace
# cannot resolve on their own — without it a fresh tree fails at "no
# pubspec.lock", which reads like a broken check rather than an unresolved
# workspace.
"packages/dvm/**":
  - "dart pub get && dart analyze"
  - "dart format --output=none --set-exit-if-changed packages/dvm"
  - "cd packages/dvm && dart test"

# The workspace root's pubspec and lock decide what every member resolves to, so
# a change to either is verified by the same suite.
"pubspec.yaml":
  - "dart pub get && dart analyze"
  - "cd packages/dvm && dart test"
"pubspec.lock":
  - "dart pub get && dart analyze"
  - "cd packages/dvm && dart test"

# The install script is shipped to users verbatim over curl, and it now HAS a
# test suite: tool/test_install_sh.sh sources it with DVM_INSTALL_SH_LIB=1 and
# drives its pure functions — target detection, the release-JSON parsing, the
# startup-file shadow scan, and the closing message a user actually reads.
#
# This rule used to be `sh -n install.sh` alone, with a comment saying the
# script had no suite. That comment outlived the fact: the suite was added with
# the shadow scan and CI ran it from the start, so for the life of that leaf the
# gate went green on a parse check while the 69 assertions that guard the
# behaviour ran only after push. That is the "check that cannot fail" this
# file's header warns about — not a command that cannot fail, but one that fails
# at different things than CI does.
#
# These are the commands .github/workflows/test.yml runs in its "Check
# install.sh" step, pasted rather than approximated. release.yml runs a subset.
#
# DIVERGENCE, stated rather than left to be discovered: shellcheck is
# conditional in CI too — preinstalled on the ubuntu images, absent on the macOS
# ones — so the `command -v` guard below is CI's own, not a local weakening of
# it. On a machine without shellcheck this rule is `sh -n` plus the suite,
# exactly as a macOS runner is, and the lint gap is closed by the ubuntu job.
"install.sh":
  - "sh -n install.sh"
  - "if command -v shellcheck > /dev/null 2>&1; then shellcheck --shell=sh install.sh; else echo 'shellcheck not present; ran sh -n only'; fi"
  - "sh tool/test_install_sh.sh"

# The suite that guards install.sh guards nothing if it is not itself run when
# it changes: a broken assertion lands green and install.sh silently stops being
# covered, which is the same failure as above one level further out.
"tool/test_install_sh.sh":
  - "sh -n install.sh"
  - "sh tool/test_install_sh.sh"

# The developer script that installs a build of the local checkout by calling
# install.sh's own functions. It was UNTRACKED until this leaf, and that is
# exactly how it broke unseen: it called warn_about_shadows with two arguments
# after that function grew a third, so under `set -u` it died on
# "$3: unbound variable" — after installing the binary and before printing one
# word of guidance. No rule can match a file nobody tracks, so it never appeared
# as unchecked either; it was absent from the report rather than red in it.
#
# `sh -n` is listed first and is NOT the check that matters: a wrong-arity call
# parses perfectly. What matters is that tool/test_install_sh.sh now RUNS this
# script end to end against a throwaway DVM_HOME with a stub `dart` on PATH, and
# asserts it reaches its LAST LINE — because its `trap ... EXIT` turns a fatal
# `set -u` abort into exit 0 under bash, so exit status alone reports that crash
# as a success.
#
# NO shellcheck line here, unlike the install.sh rule above: shellcheck is not
# installed on the machine this rule was written on, so listing it would put a
# command into this gate that has never been observed to run. Worth adding by
# someone who can watch it pass.
"tool/install_from_main.sh":
  - "sh -n tool/install_from_main.sh"
  - "sh tool/test_install_sh.sh"

# The release scripts. `bash -n` is what test.yml runs on them ("Check the
# release scripts parse") and it is all that can run here: executing them for
# real packages and uploads release artifacts.
"tool/stamp_version.sh":
  - "bash -n tool/stamp_version.sh"
# Only the alpha build calls this, so nothing in the Dart suite exercises it. The
# syntax check is what CI runs; the behaviour it guards (kBuildTag stays empty in
# the checkout) is asserted from Dart in test/release/version_stamp_test.dart,
# which the packages/dvm rule above already runs.
"tool/stamp_build_tag.sh":
  - "bash -n tool/stamp_build_tag.sh"
  - "cd packages/dvm && dart test test/release/version_stamp_test.dart"
"tool/package_release_assets.sh":
  - "bash -n tool/package_release_assets.sh"

# The docs site. The slot the `unchecked-ok` note below reserved.
#
# DIVERGENCE FROM CI, stated rather than left to be discovered: nothing in
# .github/workflows/test.yml runs these today — that workflow tests packages/dvm
# and install.sh only, and deploy-docs.yml builds the site but runs on pushes to
# main, after review. So this gate is currently STRICTER than CI: a docs change
# that breaks the build is caught here and not by a PR check. Closing that gap
# means adding a docs job to test.yml, which is a different file and a different
# owner.
#
# `cd apps/docs && dart test` is minutes, not seconds: it runs a real
# `jaspr build` and then serves the output at the domain root. That is
# deliberate — the failure mode this site has is a silent 404 on a reference
# that resolves nowhere, and nothing short of serving it and fetching what the
# pages point at catches that.
"apps/docs/**":
  - "dart pub get && dart analyze"
  - "dart format --output=none --set-exit-if-changed apps/docs"
  - "cd apps/docs && dart test"

unchecked-ok:
  # Prose at the repo root. Wrong content here is a review problem, not
  # something a command can decide. This is the ROOT-level glob only: the docs
  # site's own markdown under apps/docs/content is covered by the "apps/docs/**"
  # rule above, where check_links.dart and navigation_test.dart really can fail
  # on it. Do NOT widen this to `**/*.md`.
  - "*.md"
  # The harnesses' own state and rule files. game_loop verifies its own
  # integrity at spawn, and re-checking it from inside itself proves nothing.
  - ".game_loop/**"
  - ".showrunner/**"
  - ".claude/**"
  - ".github/**"
  - "LICENSE"
  - ".gitignore"
