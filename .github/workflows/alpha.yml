name: Alpha

# THE ROLLING ALPHA: one prerelease, always the latest main, republished on every
# push. `install.sh --alpha` is the only thing that installs it, and a plain
# install can never resolve to it.
#
# THIS IS NOT A RELEASE, AND release.yml IS NOT WEAKENED BY IT. That workflow is
# `workflow_dispatch`-only on purpose — its header says a release goes out only
# after a human chose it — and every line of that guarantee still holds: this
# file cannot create a `v*` tag, cannot create a non-prerelease release, and
# cannot publish a stable version. What it does is publish a DIFFERENT artifact
# under a different tag, marked prerelease, which the stable paths are already
# blind to: `pick_tag`'s stable channel drops prereleases, and updater.dart's
# release scan drops this one twice over — once on the flag, and once because
# the tag does not match `^v\d+\.\d+\.\d+`.
#
# `dvm update --alpha` reaches it by INVERTING both of those in a second scan of
# its own (`Updater.latestAlphaRelease`), never by relaxing the first one, so the
# guarantee above is unchanged: no stable path can resolve to this release.
#
# THE TITLE AND THE TARGET ARE READ BY THAT PATH, so neither is decoration. An
# alpha's version is the version it was cut from, and semver ignores build
# metadata — so `--alpha` cannot ask "is the published one newer?" and asks "is
# it a different COMMIT?" instead. It reads that commit from `target_commitish`
# (which is why the release is recreated with `--target "${GITHUB_SHA}"` rather
# than left pointing at a branch) and falls back to the `dvm alpha (<sha>)`
# title. Publishing this release without either would make every `--alpha` run
# reinstall the same build.
#
# ONE ROLLING TAG, `alpha`, RATHER THAN A TAG PER COMMIT — and that is a
# correctness requirement, not tidiness. install.sh fetches
# `/releases?per_page=100` and filters inside that one page: once ~100 alpha
# prereleases had accumulated on main, the newest STABLE release would fall off
# page one and a plain `curl … | sh` would die with "could not find a published
# release carrying dvm-<target>.zip" on a repo whose releases are plainly there.
# A per-push tag scheme would therefore break the DEFAULT installer for
# everybody, on a delay, for a feature nobody asked to opt into. One tag that is
# deleted and recreated is bounded at exactly one prerelease, forever, with no
# pruning job to get wrong.
#
# The cost of that choice, stated: an older alpha cannot be installed later —
# there is no tag left naming it. `--alpha` means "the latest main", which is
# what was asked for, and `DVM_VERSION` still names any real release exactly.
#
# THE VERSION IT REPORTS. `tool/stamp_version.sh` refuses a version the pubspec
# does not claim, and that refusal is untouched here: this build hands it the
# pubspec's OWN version, which it can never refuse, and then stamps its identity
# separately with `tool/stamp_build_tag.sh`. The binary reports
# `<pubspec version>+alpha.g<short sha>`, so `dvm --version` answers "is this an
# alpha, and which commit?" months after the install — which a bare version
# could not.
on:
  push:
    branches: [main]
  # Re-cut the alpha from the current main without pushing anything — for when a
  # publish was cancelled and the tag is missing.
  workflow_dispatch:

permissions:
  contents: read

# A newer main makes an older alpha irrelevant, so the older run is cancelled
# rather than queued behind it.
#
# THE TRADEOFF, because release.yml makes the opposite choice for a reason:
# cancelling a run between "old release deleted" and "new one created" leaves NO
# alpha published. That is survivable in a way a half-published release is not —
# `install.sh --alpha` refuses loudly ("could not find a published PRERELEASE
# carrying …") and installs nothing, rather than installing something wrong —
# and the next push, or a `workflow_dispatch` of this file, puts it back. The
# queued alternative would make a burst of pushes cost a full five-runner build
# each.
concurrency:
  group: alpha
  cancel-in-progress: true

jobs:
  # What is being built, decided once. The version comes from the pubspec rather
  # than from a tag, because there is no tag yet and the whole point of an alpha
  # is that nobody has cut a version for it.
  resolve:
    name: Resolve the alpha
    runs-on: ubuntu-latest
    timeout-minutes: 5
    # A fork gets pushes to its own main and has no business publishing to this
    # repo's releases; without this it gets a failing job on every push.
    if: github.repository == 'mrgnhnt96/dvm'
    outputs:
      version: ${{ steps.resolve.outputs.version }}
      build_tag: ${{ steps.resolve.outputs.build_tag }}
      short_sha: ${{ steps.resolve.outputs.short_sha }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Resolve
        id: resolve
        run: |
          set -euo pipefail

          # The same expression release.yml's dry-run branch uses, and for the
          # same reason: it is what stamp_version.sh compares against, so the
          # refusal can never fire on a value read out of the file it checks.
          version="$(sed -n 's/^version:[[:space:]]*\([^[:space:]#]*\).*/\1/p' \
            packages/dvm/pubspec.yaml | head -n 1)"
          if [ -z "${version}" ]; then
            echo "::error::packages/dvm/pubspec.yaml has no top-level version:"
            exit 1
          fi

          short_sha="$(git rev-parse --short=7 HEAD)"
          # `g` for git, the git-describe convention. It also keeps the
          # identifier from being an all-digit string that reads like a number.
          build_tag="alpha.g${short_sha}"

          {
            echo "version=${version}"
            echo "build_tag=${build_tag}"
            echo "short_sha=${short_sha}"
          } >> "${GITHUB_OUTPUT}"

          {
            echo "## dvm alpha"
            echo
            echo "- commit: \`${short_sha}\`"
            echo "- reports: \`${version}+${build_tag}\`"
          } >> "${GITHUB_STEP_SUMMARY}"

  # An alpha must not be publishable from a red tree either. This is release.yml's
  # `verify` job, unchanged, and deliberately NOT the full cross-platform matrix:
  # test.yml already runs that on this same commit (it triggers on pushes to
  # main), and duplicating four OS runners per push would double the bill for a
  # second copy of the same answer. What is repeated here is the cheap subset
  # whose answer has to be known for THIS commit before anything is published.
  #
  # Not reached through `workflow_run`, for the reason release.yml gives: that
  # only tells you some run of Test finished, not what it said about this commit.
  verify:
    name: Analyze and test
    needs: resolve
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Dart
        uses: dart-lang/setup-dart@v1
        with:
          sdk: stable

      # From the repo root: packages/dvm is a workspace member and cannot
      # resolve on its own.
      - name: Install dependencies
        run: dart pub get

      - name: Analyze
        run: dart analyze

      - name: Check formatting
        run: dart format --output=none --set-exit-if-changed .

      - name: Test
        working-directory: packages/dvm
        run: dart test

      - name: Check install.sh
        run: |
          sh -n install.sh
          sh tool/test_install_sh.sh

  build:
    name: ${{ matrix.target }}
    needs: [resolve, verify]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      # The same five targets release.yml builds, on the same images. A target
      # missing from an alpha is a platform where `--alpha` refuses to install,
      # which is exactly the shape of bug an alpha exists to find early.
      matrix:
        include:
          - os: macos-14
            target: macos-arm64
            binary: dvm
          - os: macos-15-intel
            target: macos-x64
            binary: dvm
          - os: ubuntu-latest
            target: linux-x64
            binary: dvm
          - os: ubuntu-24.04-arm
            target: linux-arm64
            binary: dvm
          - os: windows-latest
            target: windows-x64
            binary: dvm.exe

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Dart
        uses: dart-lang/setup-dart@v1
        with:
          sdk: stable

      - name: Install dependencies
        run: dart pub get

      # The pubspec's own version, so stamp_version.sh's refusal cannot fire —
      # and is not weakened either. It still means what it always meant: a
      # binary may not report a version its package does not claim.
      - name: Stamp the version
        shell: bash
        run: bash tool/stamp_version.sh "${{ needs.resolve.outputs.version }}"

      # ...and this is where "it is an alpha, from this commit" gets recorded.
      # Only this workflow calls it; a release's kBuildTag stays the empty string
      # committed to the repo.
      - name: Stamp the build tag
        shell: bash
        run: bash tool/stamp_build_tag.sh "${{ needs.resolve.outputs.build_tag }}"

      # -D__DVM_COMPILED__=true for the same reason release.yml passes it: it is
      # what makes kIsCompiled true, and kIsCompiled gates `dvm update` and the
      # ambient version check. An alpha built without it is inert on both counts
      # and looks completely normal.
      - name: Compile
        shell: bash
        run: |
          mkdir -p build
          dart compile exe packages/dvm/bin/dvm.dart \
            -o "build/${{ matrix.binary }}" \
            -D__DVM_COMPILED__=true

      # ASSERT THE OUTPUT, NOT THE ARTIFACT — and here that assertion IS the
      # feature. `dvm --version` reporting `<version>+alpha.g<sha>` is the only
      # thing that lets a user answer "am I on an alpha?" later, so a stamp that
      # silently did not land has to fail the build rather than ship a binary
      # indistinguishable from a release.
      - name: Smoke test the binary
        shell: bash
        run: |
          set -euo pipefail
          reported="$(./build/${{ matrix.binary }} --version)"
          echo "${reported}"
          expected="dvm ${{ needs.resolve.outputs.version }}+${{ needs.resolve.outputs.build_tag }}"
          if [ "${reported}" != "${expected}" ]; then
            echo "::error::built binary reports [${reported}], expected [${expected}]"
            exit 1
          fi
          ./build/${{ matrix.binary }} --help > /dev/null

      # upload-artifact does not preserve the executable bit;
      # tool/package_release_assets.sh chmods before zipping for that reason.
      - name: Upload the binary
        uses: actions/upload-artifact@v4
        with:
          name: dvm-${{ matrix.target }}
          path: build/${{ matrix.binary }}
          retention-days: 7
          if-no-files-found: error

  publish:
    name: Publish the alpha
    needs: [resolve, build]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      # Deleting and creating the `alpha` release, and its tag.
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download the binaries
        uses: actions/download-artifact@v4
        with:
          path: artifacts
          pattern: dvm-*

      # The same five zips and five checksums a release ships, from the same
      # script. An alpha whose assets were named or laid out differently would
      # not be installable by install.sh at all.
      - name: Package the assets
        run: bash tool/package_release_assets.sh artifacts release-assets

      - name: Write the release notes
        env:
          VERSION: ${{ needs.resolve.outputs.version }}
          BUILD_TAG: ${{ needs.resolve.outputs.build_tag }}
        run: |
          set -euo pipefail
          cat > alpha-notes.md <<NOTES
          The latest \`main\`, built and published automatically. **This is not a release.**

          - commit: \`${GITHUB_SHA}\`
          - reports itself as: \`${VERSION}+${BUILD_TAG}\`

          Install it:

          \`\`\`sh
          curl -fsSL https://raw.githubusercontent.com/${GITHUB_REPOSITORY}/main/install.sh | sh -s -- --alpha
          \`\`\`

          This tag is **rolling**: it is deleted and recreated on every push to \`main\`, so it
          always names the newest commit and never names this one for long.

          Moving around from here does not need the installer: \`dvm update --alpha\` takes the
          newest alpha, \`dvm update --stable\` goes back to the newest release. A bare
          \`dvm update\` still only ever installs stable releases, and will not swap this build
          for one that is not actually ahead of it.
          NOTES
          cat alpha-notes.md

      # DELETE THEN CREATE, WITH THE ASSETS IN THE CREATE. `gh release create`
      # takes the files, so there is no window where the `alpha` release exists
      # with nothing attached to it. --cleanup-tag removes the old tag too, so
      # the new one can point at this commit.
      #
      # A missing release is not an error here: the first ever run has none, and
      # neither does a run following a cancelled publish.
      - name: Republish the rolling alpha
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SHORT_SHA: ${{ needs.resolve.outputs.short_sha }}
        run: |
          set -euo pipefail

          if gh release view alpha --repo "${GITHUB_REPOSITORY}" > /dev/null 2>&1; then
            echo "Deleting the previous alpha release and its tag."
            gh release delete alpha --repo "${GITHUB_REPOSITORY}" --yes --cleanup-tag
          else
            echo "No alpha release to replace."
          fi

          # --prerelease is what keeps this invisible to a plain install.
          # --latest=false is belt and braces: GitHub never puts a prerelease in
          # the "Latest" slot, and this says so rather than relying on it.
          # --target pins the tag to the commit that was actually built, not to
          # whatever the branch may have moved on to since.
          gh release create alpha \
            --repo "${GITHUB_REPOSITORY}" \
            --target "${GITHUB_SHA}" \
            --title "dvm alpha (${SHORT_SHA})" \
            --prerelease \
            --latest=false \
            --notes-file alpha-notes.md \
            release-assets/*.zip \
            release-assets/*.zip.sha256

      # THE TWO THINGS `install.sh --alpha` NEEDS TO BE TRUE, asserted where they
      # were just made. The asset set is the contract (see
      # tool/package_release_assets.sh); the prerelease FLAG is what `pick_tag`
      # filters on, so an alpha published without it would be invisible to
      # `--alpha` AND visible to every plain install — the one outcome this whole
      # file exists to prevent.
      - name: Verify the published alpha
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail

          is_prerelease="$(gh release view alpha --repo "${GITHUB_REPOSITORY}" \
            --json isPrerelease --jq '.isPrerelease')"
          if [ "${is_prerelease}" != "true" ]; then
            echo "::error::the alpha release is not flagged prerelease; a plain install could resolve to it"
            exit 1
          fi

          # THE THIRD THING, and it is what `dvm update --alpha` decides on.
          # That path compares COMMITS, not versions (every alpha of a release
          # is semver-equal to it), and reads the published one from here. A
          # release left pointing at a branch would make every `--alpha` run
          # reinstall the build the user already has, silently and forever.
          target="$(gh release view alpha --repo "${GITHUB_REPOSITORY}" \
            --json targetCommitish --jq '.targetCommitish')"
          if ! printf '%s' "${target}" | grep -Eq '^[0-9a-f]{40}$'; then
            echo "::error::the alpha's target_commitish is [${target}], not a commit sha; dvm update --alpha could not tell one alpha from another"
            exit 1
          fi
          if [ "${target}" != "${GITHUB_SHA}" ]; then
            echo "::error::the alpha names commit ${target} but was built from ${GITHUB_SHA}"
            exit 1
          fi

          published="$(gh release view alpha --repo "${GITHUB_REPOSITORY}" \
            --json assets --jq '.assets[].name')"
          missing=0
          for target in linux-x64 linux-arm64 macos-x64 macos-arm64 windows-x64; do
            for name in "dvm-${target}.zip" "dvm-${target}.zip.sha256"; do
              if ! grep -qx "${name}" <<< "${published}"; then
                echo "::error::missing alpha asset: ${name}"
                missing=1
              fi
            done
          done
          [ "${missing}" -eq 0 ] || exit 1
          echo "All 10 assets are present, it is flagged prerelease, and it names ${target}."

          {
            echo "### Published"
            echo
            echo '```'
            cat release-assets/*.sha256
            echo '```'
          } >> "${GITHUB_STEP_SUMMARY}"
