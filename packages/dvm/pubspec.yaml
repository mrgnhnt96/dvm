name: dvm
description: >
  A per-project Dart SDK version manager. Keeps every SDK in one central
  cache, pins a version per project with .dvmrc, and forwards commands to
  the right SDK. Installs the `dvm` executable.
version: 0.1.0
repository: https://github.com/mrgnhnt96/dvm
issue_tracker: https://github.com/mrgnhnt96/dvm/issues
documentation: https://dvm.mrgnhnt.com

resolution: workspace

environment:
  sdk: ^3.6.0

# Never published. GitHub Releases + install.sh + `dvm update` is the only
# channel, so `dart pub publish` should fail on the tooling rather than on
# somebody remembering. (No Homebrew tap either; ARCHITECTURE.md's
# "Distribution" section says why.)
publish_to: none

executables:
  dvm:

dependencies:
  archive: ^4.0.0
  args: ^2.6.0
  crypto: ^3.0.0
  file: ^7.0.0
  http: ^1.2.0
  path: ^1.9.0
  pub_semver: ^2.1.0

dev_dependencies:
  lints: ^6.0.0
  test: ^1.26.0
