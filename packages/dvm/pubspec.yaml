name: dvm_cli
description: >
  A per-project Dart SDK version manager. Keeps every SDK in one central
  cache, pins a version per project with .dvmrc, and forwards commands to
  the right SDK. Installs the `dvm` executable.
version: 0.1.0-dev
repository: https://github.com/mrgnhnt96/dvm
issue_tracker: https://github.com/mrgnhnt96/dvm/issues
documentation: https://mrgnhnt.com/dvm/

resolution: workspace

environment:
  sdk: ^3.6.0

# Never published. GitHub Releases + install.sh + `dvm update` is the only
# channel, so `dart pub publish` should fail on the tooling rather than on
# somebody remembering. (No Homebrew tap either; ARCHITECTURE.md's
# "Distribution" section says why.)
publish_to: none

# The executable is `dvm` even though the package is `dvm_cli`. The short name
# was unavailable on pub.dev, which no longer constrains anything now that we
# do not publish -- but the package name is load-bearing in every
# `package:dvm_cli/...` import, so renaming it is a mechanical change worth
# doing deliberately, not a drive-by. What a user types is `dvm` regardless.
executables:
  dvm:

dependencies:
  archive: ^4.0.0
  args: ^2.6.0
  crypto: ^3.0.0
  file: ^7.0.0
  http: ^1.2.0
  path: ^1.9.0
  pub_semver: ^2.1.0

dev_dependencies:
  lints: ^6.0.0
  test: ^1.26.0
