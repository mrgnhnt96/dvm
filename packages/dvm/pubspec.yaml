name: dvm_cli
description: >
  A per-project Dart SDK version manager. Keeps every SDK in one central
  cache, pins a version per project with .dvmrc, and forwards commands to
  the right SDK. Installs the `dvm` executable.
version: 0.1.0-dev
repository: https://github.com/mrgnhnt96/dvm
issue_tracker: https://github.com/mrgnhnt96/dvm/issues
documentation: https://mrgnhnt96.github.io/dvm/

resolution: workspace

environment:
  sdk: ^3.6.0

# The executable is `dvm` even though the package is `dvm_cli`: the short
# name is squatted on pub.dev by a 9-year-old Dart 1 alpha. Homebrew is the
# primary channel and installs the same binary under the same name, so what
# a user types is `dvm` either way.
executables:
  dvm:

dependencies:
  archive: ^4.0.0
  args: ^2.6.0
  file: ^7.0.0
  http: ^1.2.0
  path: ^1.9.0

dev_dependencies:
  lints: ^6.0.0
  test: ^1.26.0
